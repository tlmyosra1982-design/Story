
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#21152d">
<title>YOSRA | The Rolling Pumpkin</title>
<style>
:root{
 --bg:#171020;--panel:#281b32;--gold:#f3c879;
 --cream:#fff4df;--muted:#c9b9ce;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--cream);font-family:Tahoma,Arial,sans-serif}
header{text-align:center;padding:22px 12px 16px;background:linear-gradient(140deg,#21152d,#49304e);border-bottom:1px solid #806047}
.brand{color:var(--gold);letter-spacing:4px;font-size:13px}
h1{font-size:25px;margin:12px 0 5px}
.subtitle{font-size:13px;color:var(--muted)}
main{max-width:760px;margin:auto;padding:15px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:14px}
button{border:1px solid #82638e;border-radius:13px;padding:11px 15px;background:#382744;color:white;font-size:14px;cursor:pointer}
button:active{transform:scale(.97)}
button.primary{background:#8a5b9d;border-color:#c49bda}
button.gold{background:#8d6334;border-color:var(--gold)}
.scene{
 background:linear-gradient(#25394a 0%,#59624c 57%,#806044 100%);
 border:1px solid #947451;border-radius:20px;min-height:260px;
 position:relative;overflow:hidden;display:flex;align-items:center;
 justify-content:center;padding:8px;
 box-shadow:inset 0 0 35px #17102066,0 12px 30px #0005;
}
.scene svg{width:100%;max-width:600px;height:auto;position:relative;z-index:1}
.story-card{margin-top:14px;background:var(--panel);border:1px solid #594365;border-radius:18px;padding:18px}
.counter{color:var(--gold);font-size:12px}
.english{direction:ltr;text-align:left;font-family:Georgia,serif;font-size:19px;line-height:1.7;margin:13px 0}
.persian{font-size:15px;line-height:2;color:#e5d6c7}
.translation{border-top:1px solid #594365;padding-top:12px;margin-top:12px}
.hidden{display:none}
.navigation{display:flex;justify-content:space-between;gap:10px;margin-top:15px}
.navigation button{flex:1}
h2{font-size:18px;color:var(--gold)}
.quiz-option{display:block;width:100%;text-align:left;direction:ltr;margin:9px 0;background:#34243d;padding:13px}
.feedback{text-align:center;min-height:28px;color:var(--gold);margin:12px}
.score{text-align:center;color:var(--gold);margin:10px}
footer{text-align:center;color:#a99aab;font-size:11px;padding:20px}
.leaf{position:fixed;top:-30px;z-index:20;pointer-events:none;animation:fall 3.5s linear forwards;font-size:24px}
@keyframes fall{to{transform:translateY(110vh) rotate(650deg);opacity:0}}
</style>
</head>
<body>
<header>
 <div class="brand">Y O S R A</div>
 <h1>🎃 The Rolling Pumpkin</h1>
 <div class="subtitle">An Iranian folk tale · داستان کدو قلقلی</div>
</header>

<main>
 <div class="toolbar">
  <button class="primary" onclick="toggleTranslation()">ترجمه فارسی</button>
  <button onclick="speakStory()">🔊 Listen</button>
  <button onclick="stopSpeech()">■ Stop</button>
 </div>

 <div class="scene" id="scene"></div>

 <section class="story-card">
  <div class="counter" id="counter"></div>
  <div class="english" id="english"></div>
  <div class="translation" id="translation">
   <div class="persian" id="persian"></div>
  </div>
  <div class="navigation">
   <button onclick="previousPage()">❮ قبلی</button>
   <button class="gold" onclick="nextPage()">بعدی ❯</button>
  </div>
 </section>

 <section class="story-card">
  <h2>🍂 Story Challenge</h2>
  <div class="persian">به پرسش‌ها پاسخ بده و امتیاز بگیر.</div>
  <div id="questionArea"></div>
  <div class="feedback" id="feedback"></div>
  <div class="score" id="score">Score: 0</div>
 </section>
</main>

<footer>YOSRA · Interactive Language Learning</footer>

<script>
const pages=[
{

{

cast:["woman","lion"]
},
{

fa:"بعد از آن با پلنگ روبه‌رو شد. پلنگ هم می‌خواست او را بخورد. پیرزن زیرک دوباره همان قول را داد و به راهش ادامه داد.",
cast:["woman","leopard"]
},
{

fa:"سرانجام به خانه دخترش رسید. دختر با خوشحالی از او استقبال کرد. با هم صحبت کردند، غذای خوشمزه خوردند و لحظات خوبی داشتند.",

{

},
{
en:"The pumpkin began to roll down the path. It rolled past the leopard, the lion and the wolf. Each animal asked, “Have you seen an old woman?” The pumpkin rolled on and on!",
fa:"کدو شروع کرد به غلتیدن در مسیر. از کنار پلنگ، شیر و گرگ گذشت. هر حیوان پرسید: «پیرزنی ندیدی؟» اما کدو همین‌طور غلتید و رفت!",
cast:["pumpkin","wolf","lion"]
},
{
en:"At last, the pumpkin reached the old woman's home. She came out safely and happily. The clever old woman had escaped from all the hungry animals!",
fa:"سرانجام کدو به خانه پیرزن رسید. پیرزن سالم و خوشحال از داخل کدو بیرون آمد. او با زیرکی از دست همه حیوانات گرسنه فرار کرده بود!",

function renderScene(){
let svg=`<svg viewBox="0 0 500 230" xmlns="http://www.w3.org/2000/svg">${defs}${backgroundSVG()}`;
const cast=pages[current].cast;
if(cast.includes("woman"))svg+=womanSVG(25,.88);
if(cast.includes("daughter"))svg+=daughterSVG();
if(cast.includes("pumpkin"))svg+=pumpkinSVG();
let animals=cast.filter(x=>["wolf","lion","leopard"].includes(x));
animals.forEach((a,i)=>svg+=animalSVG(a,270+i*55,true));
svg+=`</svg>`;
document.getElementById("scene").innerHTML=svg;
}

let current=0,showTranslation=true;
function render(){
let p=pages[current];
document.getElementById("counter").textContent=`Scene ${current+1} / ${pages.length}`;
document.getElementById("english").textContent=p.en;
document.getElementById("persian").textContent=p.fa;
document.getElementById("translation").classList.toggle("hidden",!showTranslation);
renderScene();
}
function nextPage(){
if(current<pages.length-1){current++;stopSpeech();render()}
}
function previousPage(){
if(current>0){current--;stopSpeech();render()}
}
function toggleTranslation(){
showTranslation=!showTranslation;
document.getElementById("translation").classList.toggle("hidden",!showTranslation);
}
function speakStory(){
if(!("speechSynthesis" in window)){
alert("Speech is not supported on this browser.");return;
}
stopSpeech();
let utter=new SpeechSynthesisUtterance(pages[current].en);
utter.lang="en-US";utter.rate=.88;
speechSynthesis.speak(utter);
}
function stopSpeech(){
if("speechSynthesis" in window)speechSynthesis.cancel();
}

const questions=[
{q:"Who did the old woman want to visit?",o:["Her daughter","The wolf","The king"],a:0},
{q:"Which animal did she meet first?",o:["Lion","Wolf","Leopard"],a:1},
{q:"What did her daughter find?",o:["A basket","A big pumpkin","A carriage"],a:1},
{q:"How did the old woman get home?",o:["By walking","By flying","Inside a rolling pumpkin"],a:2}
];

let qi=0,score=0,answered=false;
function renderQuestion(){
let q=questions[qi];
document.getElementById("questionArea").innerHTML=
`<h3 style="direction:ltr;text-align:left">${qi+1}. ${q.q}</h3>`+
q.o.map((v,i)=>
`<button class="quiz-option" onclick="answer(${i})">${String.fromCharCode(65+i)}. ${v}</button>`
).join("");
document.getElementById("feedback").textContent="";
document.getElementById("score").textContent=`Score: ${score}`;
answered=false;
}
function answer(i){
if(answered)return;
answered=true;
let q=questions[qi];
if(i===q.a){
score+=10;
document.getElementById("feedback").textContent="🎉 Excellent! Correct answer!";
celebrate();
playMelody();
}else{
document.getElementById("feedback").textContent="Not quite! The correct answer: "+q.o[q.a];
}
document.getElementById("score").textContent=`Score: ${score}`;
setTimeout(()=>{
qi++;
if(qi<questions.length){
renderQuestion();
}else{
document.getElementById("questionArea").innerHTML=
`<h3 style="text-align:center">🏆 You finished the story!</h3>
<p class="persian" style="text-align:center">آفرین! امتیاز نهایی شما: ${score}</p>
<button class="primary" onclick="restartQuiz()">دوباره بازی کن</button>`;
}
},1300);
}
function restartQuiz(){
qi=0;score=0;renderQuestion();
}
function celebrate(){
for(let i=0;i<24;i++){
let el=document.createElement("div");
el.className="leaf";
el.textContent=["🍂","🍁","🌰"][i%3];
el.style.left=Math.random()*100+"vw";
el.style.animationDelay=Math.random()*.8+"s";
document.body.appendChild(el);
setTimeout(()=>el.remove(),4500);
}
}
function playMelody(){
try{
let ctx=new(window.AudioContext||window.webkitAudioContext)();
[523,659,784,1046].forEach((f,i)=>{
let o=ctx.createOscillator();
let g=ctx.createGain();
o.type="sine";
o.frequency.value=f;
g.gain.setValueAtTime(.0001,ctx.currentTime+i*.15);
g.gain.exponentialRampToValueAtTime(.13,ctx.currentTime+i*.15+.03);
g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+i*.15+.25);
o.connect(g);
g.connect(ctx.destination);
o.start(ctx.currentTime+i*.15);
o.stop(ctx.currentTime+i*.15+.27);
});
setTimeout(()=>ctx.close(),1300);
}catch(e){}
}

render();
renderQuestion();
</script>
</body>
</html>
